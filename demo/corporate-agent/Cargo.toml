[package]
name = "corporate-agent-demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "A corporate assistant agent on the full appa-agent loop over mock internal systems, used to exercise OpenAPPA"
autobins = false

[workspace]

[dependencies]
appa-runtime = { path = "../../appa-runtime" }
appa-engine = { path = "../../appa-engine" }
appa-agent = { path = "../../appa-agent" }
corp-systems = { path = "../corp-systems" }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tokio-util = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[[bin]]
name = "appa-corp-agent"
path = "src/bin/appa_corp_agent.rs"
