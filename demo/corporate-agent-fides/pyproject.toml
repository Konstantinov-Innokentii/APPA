[project]
name = "corporate-agent-fides"
version = "0.1.0"
description = "The OpenAPPA corporate demo, defended by FIDES"
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core",
    "agent-framework-openai",
    "mcp<2",
]

[project.optional-dependencies]
foundry = [
    "agent-framework-azure-ai",
    "azure-identity",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
corp-agent-fides = "corp_fides.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corp_fides"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
prerelease = "allow"
